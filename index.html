<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雨中荷</title>
<style>
:root{
  --bg:#050605; --ink:#e9e4dc; --ink-dim:rgba(233,228,220,.55); --seal:#b3242c;
  --glass:rgba(12,14,13,.38); --line:rgba(233,228,220,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#050605; } }
:root[data-theme="dark"]{ --bg:#050605; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);
  font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#veil{position:fixed;inset:0;background:#000;pointer-events:none;transition:opacity 3.2s ease}
#title{position:fixed;right:clamp(18px,4.5vw,64px);top:clamp(18px,7vh,80px);display:flex;gap:14px;align-items:flex-start;
  pointer-events:none;opacity:0;transition:opacity 2.4s ease 1.2s}
#title .v{writing-mode:vertical-rl;font-size:clamp(22px,2.6vw,38px);letter-spacing:.42em;font-weight:300;
  text-shadow:0 0 18px rgba(0,0,0,.6);color:rgba(240,236,228,.86)}
#title .sub{writing-mode:vertical-rl;font-size:clamp(11px,.95vw,14px);letter-spacing:.5em;color:var(--ink-dim);margin-top:.6em}
#title .seal{margin-top:.2em;width:clamp(22px,2vw,30px);padding:4px 0;background:var(--seal);color:#f6e9e0;border-radius:3px;
  writing-mode:vertical-rl;font-size:clamp(10px,.85vw,13px);letter-spacing:.15em;text-align:center;opacity:.85;
  font-family:"STKaiti","KaiTi","Kaiti SC",serif;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset}
#ui{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;
  padding:5px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);opacity:0;transition:opacity .9s ease}
#ui.on{opacity:1}
#ui button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;letter-spacing:.18em;
  padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .25s}
#ui button:hover{background:rgba(255,255,255,.08)}
#ui button b{font-weight:400;color:#f2b8c4}
#hint{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 54px);transform:translateX(-50%);
  font-size:12px;letter-spacing:.4em;color:var(--ink-dim);pointer-events:none;opacity:0;transition:opacity 1.5s ease;white-space:nowrap}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--ink-dim);font-size:15px;line-height:2}
.still #ui,.still #hint,.still #title,.still #veil{display:none}
@media (max-width:520px){ #ui button{padding:8px 10px;letter-spacing:.08em} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<div id="title"><div class="v">雨中荷</div><div class="sub">一池烟雨 · 半塘清香</div><div class="seal">听雨</div></div>
<div id="hint">轻点水面 · 落一滴雨</div>
<div id="ui">
  <button id="bSnd">声音 <b>关</b></button>
  <button id="bRain">雨势 <b>中</b></button>
  <button id="bFs">全屏</button>
</div>
<div id="err"></div>

<script>
(()=>{
'use strict';
/* ==================================================================
   雨中荷 · Lotus in the Rain — a fully procedural WebGL2 scene.
   No textures, no libraries: every petal, leaf, ripple and raindrop
   is generated in code at load time.
   ================================================================== */

const Q = new URLSearchParams(location.search);
const STILL = Q.has('still');
const T_OFF = parseFloat(Q.get('still')||Q.get('t')||'0')||0;
if(STILL) document.documentElement.classList.add('still');

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:'high-performance',preserveDrawingBuffer:STILL});
function fail(msg){ const e=document.getElementById('err'); e.style.display='grid'; e.innerHTML=msg; document.getElementById('veil').style.opacity=0; }
if(!gl){ fail('此场景需要 WebGL2 支持<br>请使用最新版 Chrome / Edge / Safari / Firefox 打开'); return; }
const EXT_CBF = gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const HDR = !!EXT_CBF;
const CFMT = HDR ? gl.RGBA16F : gl.RGBA8;
const CTYPE = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

/* ---------------- small math ---------------- */
const PI=Math.PI, TAU=PI*2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
let _s=20240917; const rnd=()=>{_s=(Math.imul(_s,1664525)+1013904223)>>>0;return _s/4294967296;};
const rr=(a,b)=>a+(b-a)*rnd();
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]), norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t],
  madd:(a,b,s)=>[a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s]
};
const M={
  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  persp(f,a,n,fa){const t=1/Math.tan(f/2),m=new Float32Array(16);m[0]=t/a;m[5]=t;m[10]=(fa+n)/(n-fa);m[11]=-1;m[14]=2*fa*n/(n-fa);return m;},
  look(e,c,u){const z=V.norm(V.sub(e,c)),x=V.norm(V.cross(u,z)),y=V.cross(z,x),m=new Float32Array(16);
    m[0]=x[0];m[4]=x[1];m[8]=x[2];m[1]=y[0];m[5]=y[1];m[9]=y[2];m[2]=z[0];m[6]=z[1];m[10]=z[2];
    m[12]=-V.dot(x,e);m[13]=-V.dot(y,e);m[14]=-V.dot(z,e);m[15]=1;return m;},
  T(x,y,z){const m=M.id();m[12]=x;m[13]=y;m[14]=z;return m;},
  S(s){const m=M.id();m[0]=m[5]=m[10]=s;return m;},
  RX(a){const m=M.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;},
  RY(a){const m=M.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;},
  RZ(a){const m=M.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;},
  basis(x,y,z,t,s){const m=new Float32Array(16);m[0]=x[0]*s;m[1]=x[1]*s;m[2]=x[2]*s;m[4]=y[0]*s;m[5]=y[1]*s;m[6]=y[2]*s;m[8]=z[0]*s;m[9]=z[1]*s;m[10]=z[2]*s;m[12]=t[0];m[13]=t[1];m[14]=t[2];m[15]=1;return m;},
  chain(...ms){return ms.reduce((a,b)=>M.mul(a,b));},
  pt(m,p){return[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];}
};
/* integer hash identical to the GLSL one (ripples and splashes stay in sync) */
function pcg(v){const s=(Math.imul(v>>>0,747796405)+2891336453)>>>0;const w=Math.imul(((s>>>((s>>>28)+4))^s)>>>0,277803737)>>>0;return((w>>>22)^w)>>>0;}
/* 1D smooth noise for JS-side motion */
function n1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);const h=k=>{const s=Math.sin(k*127.1+311.7)*43758.5453;return(s-Math.floor(s))*2-1;};return lerp(h(i),h(i+1),u);}

/* ---------------- GL helpers ---------------- */
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const log=gl.getShaderInfoLog(s);console.error(log,src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));throw new Error(log);}return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};let unit=0;const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);const nm=inf.name.replace(/\[0\]$/,'');
    u[nm]={loc:gl.getUniformLocation(p,inf.name),type:inf.type,size:inf.size,unit:(inf.type===gl.SAMPLER_2D)?unit++:-1};}
  return{p,u};}
function use(P,U){gl.useProgram(P.p);if(U)set(P,U);}
function set(P,U){for(const k in U){const u=P.u[k];if(!u)continue;const v=U[k];
  switch(u.type){case gl.FLOAT:u.size>1?gl.uniform1fv(u.loc,v):gl.uniform1f(u.loc,v);break;
    case gl.FLOAT_VEC2:gl.uniform2fv(u.loc,v);break;case gl.FLOAT_VEC3:gl.uniform3fv(u.loc,v);break;case gl.FLOAT_VEC4:gl.uniform4fv(u.loc,v);break;
    case gl.FLOAT_MAT4:gl.uniformMatrix4fv(u.loc,false,v);break;case gl.INT:gl.uniform1i(u.loc,v);break;
    case gl.SAMPLER_2D:gl.activeTexture(gl.TEXTURE0+u.unit);gl.bindTexture(gl.TEXTURE_2D,v);gl.uniform1i(u.loc,u.unit);break;}}}
function buf(target,data,usage){const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,data,usage||gl.STATIC_DRAW);return b;}
function mesh(g,inst){
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const at=(loc,arr,n)=>{if(!arr)return;buf(gl.ARRAY_BUFFER,arr instanceof Float32Array?arr:new Float32Array(arr));gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,n,gl.FLOAT,false,0,0);};
  at(0,g.pos,3);at(1,g.nrm,3);at(2,g.uv,2);at(3,g.ext,4);
  buf(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(g.idx));
  const m={vao,n:g.idx.length,ic:null};
  if(inst){m.ib=buf(gl.ARRAY_BUFFER,inst.data,inst.dynamic?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);
    let off=0;const stride=inst.layout.reduce((a,b)=>a+b,0)*4;
    inst.layout.forEach((sz,i)=>{const loc=4+i;gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,sz,gl.FLOAT,false,stride,off);gl.vertexAttribDivisor(loc,1);off+=sz*4;});
    m.ic=inst.count;}
  gl.bindVertexArray(null);return m;}
function draw(m,count){gl.bindVertexArray(m.vao);if(m.ic!==null){const c=count===undefined?m.ic:count;if(c>0)gl.drawElementsInstanced(gl.TRIANGLES,m.n,gl.UNSIGNED_INT,0,c);}else gl.drawElements(gl.TRIANGLES,m.n,gl.UNSIGNED_INT,0);}

/* ---------------- geometry builders ---------------- */
function normals(pos,idx){const n=new Float32Array(pos.length);
  for(let i=0;i<idx.length;i+=3){const a=idx[i]*3,b=idx[i+1]*3,c=idx[i+2]*3;
    const e1=[pos[b]-pos[a],pos[b+1]-pos[a+1],pos[b+2]-pos[a+2]],e2=[pos[c]-pos[a],pos[c+1]-pos[a+1],pos[c+2]-pos[a+2]];
    const f=V.cross(e1,e2);for(const k of[a,b,c]){n[k]+=f[0];n[k+1]+=f[1];n[k+2]+=f[2];}}
  for(let i=0;i<n.length;i+=3){const l=Math.hypot(n[i],n[i+1],n[i+2])||1;n[i]/=l;n[i+1]/=l;n[i+2]/=l;}return n;}
function grid(nu,nv,fn,acc){ // fn(i,j) => {p,uv,ext}
  acc=acc||{pos:[],uv:[],ext:[],idx:[]};const base=acc.pos.length/3;
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const r=fn(i,j);acc.pos.push(...r.p);acc.uv.push(...r.uv);acc.ext.push(...(r.ext||[0,0,0,0]));}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=base+j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;acc.idx.push(a,c,b,b,c,d);}
  return acc;}
function finish(acc){acc.nrm=normals(acc.pos,acc.idx);return acc;}
function bez(p0,p1,p2,p3,t){const u=1-t;return[0,1,2].map(k=>u*u*u*p0[k]+3*u*u*t*p1[k]+3*u*t*t*p2[k]+t*t*t*p3[k]);}
function tube(path,radius,na,nr,kind,acc){ // path(s)->[x,y,z]
  acc=acc||{pos:[],uv:[],ext:[],idx:[]};const base=acc.pos.length/3;
  const P=[],T=[];for(let i=0;i<=na;i++){P.push(path(i/na));}
  for(let i=0;i<=na;i++){const a=P[Math.max(i-1,0)],b=P[Math.min(i+1,na)];T.push(V.norm(V.sub(b,a)));}
  let nrm=V.norm(V.cross(T[0],Math.abs(T[0][1])<0.9?[0,1,0]:[1,0,0]));
  let L=0;const lens=[0];for(let i=1;i<=na;i++){L+=V.len(V.sub(P[i],P[i-1]));lens.push(L);}
  for(let i=0;i<=na;i++){
    if(i>0){const b=V.cross(T[i-1],T[i]);const bl=V.len(b);if(bl>1e-6){const ax=V.mul(b,1/bl);const ang=Math.acos(clamp(V.dot(T[i-1],T[i]),-1,1));
      const c=Math.cos(ang),s=Math.sin(ang);const k=ax;const v=nrm;
      nrm=V.add(V.add(V.mul(v,c),V.mul(V.cross(k,v),s)),V.mul(k,V.dot(k,v)*(1-c)));}}
    const bin=V.cross(T[i],nrm);const s=i/na;const r=radius(s);
    for(let j=0;j<=nr;j++){const a=j/nr*TAU;const d=V.add(V.mul(nrm,Math.cos(a)),V.mul(bin,Math.sin(a)));
      acc.pos.push(...V.madd(P[i],d,r));acc.uv.push(s,j/nr);acc.ext.push(s,lens[i],kind,r);}}
  for(let i=0;i<na;i++)for(let j=0;j<nr;j++){const a=base+i*(nr+1)+j,b=a+1,c=a+nr+1,d=c+1;acc.idx.push(a,c,b,b,c,d);}
  return acc;}
function lathe(prof,nr){const acc={pos:[],uv:[],ext:[],idx:[]};const np=prof.length;
  for(let i=0;i<np;i++)for(let j=0;j<=nr;j++){const a=j/nr*TAU;acc.pos.push(prof[i][0]*Math.cos(a),prof[i][1],prof[i][0]*Math.sin(a));acc.uv.push(i/(np-1),j/nr);acc.ext.push(0,0,0,0);}
  for(let i=0;i<np-1;i++)for(let j=0;j<nr;j++){const a=i*(nr+1)+j,b=a+1,c=a+nr+1,d=c+1;acc.idx.push(a,b,c,b,d,c);}
  return finish(acc);}
function icosphere(sub){const t=(1+Math.sqrt(5))/2;let vs=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(V.norm);
  let fs=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  for(let s=0;s<sub;s++){const cache={};const mid=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;if(cache[k]!==undefined)return cache[k];vs.push(V.norm(V.mul(V.add(vs[a],vs[b]),.5)));return cache[k]=vs.length-1;};
    const nf=[];for(const[a,b,c]of fs){const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);nf.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);}fs=nf;}
  const pos=vs.flat();return{pos,nrm:pos.slice(),uv:null,ext:null,idx:fs.flat()};}

/* ==================================================================
   GLSL
   ================================================================== */
const HEAD=`#version 300 es
precision highp float; precision highp int;
uniform mat4 uProj,uView,uModel,uFlowerM;
uniform vec3 uCamPos,uPivot; uniform vec2 uSway;
uniform float uTime,uClip,uFocus,uAp;
const vec3 LDIR=vec3(-0.2873,0.8209,-0.4926);
const vec3 SKY=vec3(0.98,1.0,1.0);
vec3 swayP(vec3 p,float w){vec3 d=p-uPivot;float a=uSway.x*w,b=uSway.y*w;float c=cos(a),s=sin(a);
  d=vec3(d.x,c*d.y-s*d.z,s*d.y+c*d.z);c=cos(b);s=sin(b);d=vec3(c*d.x-s*d.y,s*d.x+c*d.y,d.z);return uPivot+d;}
vec3 swayN(vec3 n,float w){float a=uSway.x*w,b=uSway.y*w;float c=cos(a),s=sin(a);
  n=vec3(n.x,c*n.y-s*n.z,s*n.y+c*n.z);c=cos(b);s=sin(b);return vec3(c*n.x-s*n.y,s*n.x+c*n.y,n.z);}
`;
const FHEAD=HEAD+`
out vec4 o;
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(h12(i),h12(i+vec2(1,0)),u.x),mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s;}
vec3 skyEnv(vec3 r){
  float e=clamp(r.y,0.,1.);
  vec3 sky=mix(vec3(0.34,0.35,0.34),vec3(1.15,1.17,1.18),smoothstep(0.6,1.0,e));
  float az=atan(r.z,r.x);
  float tl=0.60+0.06*sin(az*2.0+0.7)+0.07*sin(az*5.0+2.1)+0.10*(vn(vec2(az*9.0,1.3))-.5)+0.05*(vn(vec2(az*31.0,4.1))-.5);
  float tr=1.0-smoothstep(tl-0.03,tl+0.04,e);
  // canopy gaps
  tr*=1.0-0.35*smoothstep(0.55,0.8,vn(vec2(az*18.0,e*14.0)));
  return mix(sky,vec3(0.013,0.013,0.005),tr);
}
vec3 fogit(vec3 c,vec3 wp){float d=length(wp-uCamPos);float f=1.0-exp(-max(d-2.5,0.)*0.07);return mix(c,vec3(0.085,0.088,0.084),f);}
void clipW(vec3 w){ if(uClip>0.5 && w.y<0.0) discard; }
`;

/* ---------- petals ---------- */
const VS_PETAL=HEAD+`
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNrm;layout(location=2) in vec2 aUv;layout(location=3) in vec4 aExt;
uniform float uJig[24];
out vec2 vUv;out vec4 vExt;out vec3 vN,vW;
void main(){
  int id=int(aExt.y+0.5);
  float v=aUv.y;
  vec3 p=aPos+aNrm*(uJig[id]*v*v*0.045 + sin(uTime*2.7+aExt.z*31.0+v*2.5)*0.0012*v);
  vec4 w=uFlowerM*vec4(p,1.0);
  vN=mat3(uFlowerM)*aNrm; vW=w.xyz; vUv=aUv; vExt=aExt;
  gl_Position=uProj*uView*w;
}`;
const FS_PETAL=FHEAD+`
in vec2 vUv;in vec4 vExt;in vec3 vN,vW;
void main(){
  clipW(vW);
  float u=vUv.x,v=vUv.y,ring=vExt.x,seed=vExt.z;
  vec3 N=normalize(vN);vec3 Vd=normalize(uCamPos-vW);
  float outer=0.0; if(dot(N,Vd)<0.0){N=-N;outer=1.0;}
  float ax=abs(u);

void main(){vec2 c=gl_PointCoord*2.-1.;float r=dot(c,c);if(r>1.)discard;
  float a=(1.0-r);a*=a;
  vec3 col=mix(vec3(0.55,0.58,0.60),vec3(0.95,0.75,0.80),vB);
  o=vec4(col*a*vA,0.);}`;

/* ---------- post ---------- */
const VS_FS=`#version 300 es
out vec2 vUv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vUv=vec2(p);gl_Position=vec4(vec2(p)*2.-1.,0.,1.);}`;
const POSTHEAD=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;
uniform float uNear,uFar,uFocus,uAp;
float lin(float d){float z=d*2.-1.;return 2.*uNear*uFar/(uFar+uNear-z*(uFar-uNear));}
float coc(float d){return clamp(abs(1.0/uFocus-1.0/d)*uAp,0.,1.);}
`;
const FS_DOF=POSTHEAD+`
uniform sampler2D uColor,uDepth;uniform vec2 uTexel;uniform float uMaxBlur,uRad;
void main(){
  float cd=lin(texture(uDepth,vUv).r);float cs=coc(cd)*uMaxBlur;
  vec3 col=texture(uColor,vUv).rgb;float tot=1.0;float rad=uRad;
  for(float ang=0.0;rad<uMaxBlur;ang+=2.39996323){
    vec2 tc=vUv+vec2(cos(ang),sin(ang))*uTexel*rad;
    vec3 sc=texture(uColor,tc).rgb;float sd=lin(texture(uDepth,tc).r);float ss=coc(sd)*uMaxBlur;
    if(sd>cd)ss=clamp(ss,0.,cs*2.0);
    float m=smoothstep(rad-0.5,rad+0.5,ss);
    col+=mix(col/tot,sc,m);tot+=1.0;rad+=uRad/rad;
  }
  o=vec4(col/tot,cs);
}`;
const FS_BRIGHT=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uTex;uniform vec2 uTexel;
void main(){vec3 c=vec3(0);for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++)c+=texture(uTex,vUv+vec2(i,j)*uTexel).rgb;c/=9.0;
  float l=max(c.r,max(c.g,c.b));o=vec4(c*smoothstep(0.28,1.2,l),1.);}`;
const FS_BLUR=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uTex;uniform vec2 uDir;
void main(){vec3 c=texture(uTex,vUv).rgb*0.227027;
  c+=(texture(uTex,vUv+uDir*1.384615).rgb+texture(uTex,vUv-uDir*1.384615).rgb)*0.316216;
  c+=(texture(uTex,vUv+uDir*3.230769).rgb+texture(uTex,vUv-uDir*3.230769).rgb)*0.070270;o=vec4(c,1.);}`;
const FS_FINAL=POSTHEAD+`
uniform sampler2D uColor,uDepth,uDof,uBloom;uniform vec2 uTexel;uniform float uTime,uFade,uExposure,uMaxBlurFull;
vec3 comp(vec2 uv){
  vec3 sharp=texture(uColor,uv).rgb;
  float c=coc(lin(texture(uDepth,uv).r))*uMaxBlurFull;
  vec4 b=texture(uDof,uv);
  float m=smoothstep(0.7,2.6,max(c,b.a*2.0));
  return mix(sharp,b.rgb,m);
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}
float h(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
void main(){
  vec2 d=vUv-0.5;float r2=dot(d,d);
  vec2 ca=d*r2*0.010;
  vec3 col=vec3(comp(vUv+ca).r,comp(vUv).g,comp(vUv-ca).b);
  col+=texture(uBloom,vUv).rgb*0.32;
  col*=uExposure;
  col=aces(col);
  // grade: soft, slightly cool overcast; keep the pinks alive
  float l=dot(col,vec3(0.2126,0.7152,0.0722));
  float pinkish=smoothstep(0.02,0.12,col.r-col.g);
  col=mix(vec3(l),col,mix(0.86,1.06,pinkish));
  col=col*vec3(0.985,1.0,1.0)+vec3(0.0015,0.0022,0.0022)*(1.0-l);
  col=pow(col,vec3(1.0/2.2));
  col*=1.0-0.45*smoothstep(0.2,0.9,r2*1.65);
  float g=h(gl_FragCoord.xy+fract(uTime*13.37)*vec2(397.,211.))-0.5;
  col+=g*0.022;
  o=vec4(col*uFade,1.);
}`;

/* ==================================================================
   SCENE LAYOUT — framed to match the reference shot
   ================================================================== */
const ASP0=1268/718, FOV0=34*PI/180;
const E0=[0.16,2.2,2.46], T0=[0.03,0.60,0.0];
const L={};(()=>{L.f=V.norm(V.sub(T0,E0));L.r=V.norm(V.cross(L.f,[0,1,0]));L.u=V.cross(L.r,L.f);L.t=Math.tan(FOV0/2);})();
function sray(sx,sy){return V.norm(V.add(L.f,V.add(V.mul(L.r,(sx*2-1)*L.t*ASP0),V.mul(L.u,(1-sy*2)*L.t))));}
function onPlane(sx,sy,h){const d=sray(sx,sy);const t=(h-E0[1])/d[1];return V.madd(E0,d,t);}
function sizeAt(sx,sy,w,h){return V.len(V.sub(onPlane(sx+w/2,sy,h),onPlane(sx-w/2,sy,h)))/2;}

/* ---------- lotus pad generator ---------- */
function padFns(o){const s=o.s;
  const R=th=>1+0.035*Math.sin(5*th+s[0])+0.024*Math.sin(9*th+s[1])+0.012*Math.sin(17*th+s[2])+0.006*Math.sin(31*th+s[5]);
  const H=(r,th)=>o.cup*r*r+o.wave*Math.pow(r,4)*(0.6*Math.sin(6*th+s[3])+0.4*Math.sin(11*th+s[4]))+0.004*Math.exp(-r*r*40);
  return{R,H,pt:(r,th)=>{const rr_=r*R(th);return[rr_*Math.cos(th),H(r,th),rr_*Math.sin(th)];}};}
function buildPad(o){const f=padFns(o);const NR=16,NS=112;
  const acc=grid(NS,NR,(i,j)=>{const th=i/NS*TAU;const r=Math.pow(j/NR,0.85);return{p:f.pt(Math.max(r,0.0005),th),uv:[r,i/NS],ext:[o.seed,0,0,0]};});
  finish(acc);
  // make normals face +y
  for(let i=0;i<acc.nrm.length;i+=3){if(acc.nrm[i+1]<0){acc.nrm[i]*=-1;acc.nrm[i+1]*=-1;acc.nrm[i+2]*=-1;}}
  return{mesh:mesh(acc),f};}
function padSeeds(){return[rr(0,TAU),rr(0,TAU),rr(0,TAU),rr(0,TAU),rr(0,TAU),rr(0,TAU)];}

const pads=[];   // floating pads
const leaves=[]; // upright leaves
const stems=[];
const DROP_GEO=icosphere(2);

function addPad(sx,sy,w,cup,wave,opt={}){
  const c=onPlane(sx,sy,0);const rad=sizeAt(sx,sy,w,0)*(opt.k||1);
  const o={s:padSeeds(),cup,wave,seed:rnd()*10};
  const pm=buildPad(o);
  // beads of rain sitting on the pad
  const n=Math.round((opt.drops!==undefined?opt.drops:70)*(0.6+rad));const inst=[];
  for(let i=0;i<n;i++){const r=Math.sqrt(rr(0.02,0.92)),th=rr(0,TAU);const big=rnd()<0.08;
    const sz=(big?rr(0.016,0.028):rr(0.004,0.013))/rad;const p=pm.f.pt(r,th);inst.push(p[0],p[1]+sz*0.62,p[2],sz);}
  if(rnd()<0.5){const sz=rr(0.014,0.022)/rad;inst.push(0.02,pm.f.H(0.02,0)+sz*0.5,0.01,sz);} // pooled drop in the navel
  const dm=mesh(DROP_GEO,{data:new Float32Array(inst),layout:[4],count:inst.length/4});
  pads.push({c,rad,rot:rr(0,TAU),ph:rr(0,TAU),mesh:pm.mesh,dm,tint:opt.tint||[rr(0.9,1.08),rr(0.92,1.06),rr(0.9,1.05)],seed:o.seed,model:M.id(),f:pm.f});
}

}

/* ---------- upright leaves ---------- */
function addLeaf(sx,sy,h,w,nrm,cup,wave,opt={}){
  const c=onPlane(sx,sy,h);const rad=sizeAt(sx,sy,w,h)*(opt.k||1);
  const o={s:padSeeds(),cup,wave,seed:rnd()*10};const pm=buildPad(o);
  const y=V.norm(nrm);const x=V.norm(V.cross(y,Math.abs(y[2])<0.9?[0,0,1]:[1,0,0]));const z=V.cross(x,y);
  const base=M.basis(x,y,z,c,rad);
  const root=[c[0]+(opt.rootDx||0),-0.15,c[2]+(opt.rootDz||0)];
  const inst=[];for(let i=0;i<(opt.drops||0);i++){const r=Math.sqrt(rr(0.0,0.5)),th=rr(0,TAU);const sz=rr(0.006,0.016)/rad;const p=pm.f.pt(r,th);inst.push(p[0],p[1]+sz*0.6,p[2],sz);}
  const dm=inst.length?mesh(DROP_GEO,{data:new Float32Array(inst),layout:[4],count:inst.length/4}):null;
  const lf={c,rad,base,root,mesh:pm.mesh,dm,tint:opt.tint||[1,1,1],ph:rr(0,TAU),amp:opt.amp||1,model:base};
  // stem: from below the water up to the leaf navel (attached under the leaf)
  const under=V.madd(c,y,-0.01*rad);
  const stemPath=s=>bez(root,V.lerp(root,under,0.35),V.madd(under,y,-0.45),under,s);
  lf.stem=addStem(stemPath,()=>0.012,root,lf);
  leaves.push(lf);return lf;
}
function addStem(path,rad,root,owner,col){
  const g=finish(tube(path,rad,40,8,0));
  const st={mesh:mesh(g),root,owner,ph:rr(0,TAU),col:col||[0.05,0.075,0.016],amp:1};stems.push(st);return st;}
function addRolled(a,b,r,opt={}){
  const mid=V.lerp(a,b,0.5);const up=opt.bow||0.02;
  const path=s=>{const p=V.lerp(a,b,s);p[1]+=Math.sin(s*PI)*up;return p;};
  const g=finish(tube(path,s=>r*Math.pow(Math.sin(PI*clamp(s*0.92+0.04,0,1)),0.55)*(opt.taper?lerp(1,0.35,Math.pow(s,1.5)):1),48,14,1));
  const st={mesh:mesh(g),root:opt.root||a,owner:null,ph:rr(0,TAU),col:opt.col||[0.11,0.17,0.035],amp:opt.amp||0.3};stems.push(st);return st;}

const FLOWER_POS=[0.10,0.40,0.20];
const FLOWER_BASE=M.chain(M.T(...FLOWER_POS),M.RY(0.25),M.RZ(0.12),M.RX(-0.16),M.S(1.18));
const petalTips=[];
const petalDropSpots=[];
const flower=(()=>{
  const acc={pos:[],uv:[],ext:[],idx:[]};
  const rings=[
    {n:7,a0:46,a1:64,L:0.73,W:0.48,cup:0.74,bend:0.62,hook:0.16,rA:0.075,yA:0.000,ph:0.10},
    {n:6,a0:20,a1:32,L:0.72,W:0.47,cup:0.78,bend:0.36,hook:0.20,rA:0.066,yA:0.018,ph:0.55},
    {n:4,a0:9,a1:18,L:0.60,W:0.44,cup:0.80,bend:0.10,hook:0.28,rA:0.054,yA:0.036,ph:0.30},
    {n:3,a0:6,a1:14,L:0.44,W:0.38,cup:0.85,bend:-0.04,hook:0.30,rA:0.040,yA:0.052,ph:0.80}];
  const NU=14,NV=28;let pid=0;
  rings.forEach((R,ri)=>{for(let k=0;k<R.n;k++){
    const phi=((k+R.ph+rr(-0.2,0.2))/R.n)*TAU+ri*0.41;
    const alpha=rr(R.a0,R.a1)*PI/180,Ln=R.L*rr(0.92,1.06),W=R.W*rr(0.9,1.08),cup=R.cup*rr(0.85,1.15),bend=R.bend+rr(-0.08,0.08),hook=R.hook*rr(0.7,1.3);
    const seed=rnd();const rh=[Math.cos(phi),0,Math.sin(phi)],up=[0,1,0],tg=[-Math.sin(phi),0,Math.cos(phi)];
    const dir=a=>V.add(V.mul(rh,Math.sin(a)),V.mul(up,Math.cos(a)));const nin=a=>V.add(V.mul(rh,-Math.cos(a)),V.mul(up,Math.sin(a)));
    const ang=[],cl=[];let p=V.add(V.mul(rh,R.rA),V.mul(up,R.yA));
    for(let j=0;j<=NV;j++){const v=j/NV;const a=alpha+bend*Math.pow(v,1.6)-hook*smooth(0.78,1.0,v);ang.push(a);if(j>0)p=V.madd(p,dir((a+ang[j-1])/2),Ln/NV);cl.push(p);}
    const twist=rr(-0.25,0.25);
    grid(NU,NV,(i,j)=>{const u=-1+2*i/NU,v=j/NV;
      const hw=W*0.5*(Math.pow(Math.sin(PI*Math.pow(v,1.12)),0.52)*0.94+0.06*(1-v))*(1-0.25*smooth(0.9,1.0,v));
      const lat=u*hw*(1-0.06*cup*u*u);
      let off=cup*hw*u*u*0.42*(0.6+0.4*Math.sin(PI*Math.min(v*1.1,1)));
      off+=0.006*Math.sin(u*5+v*11+seed*6)*v+twist*u*hw*v*0.5;
      const P_=V.add(V.add(cl[j],V.mul(tg,lat)),V.mul(nin(ang[j]),off));
      return{p:P_,uv:[u,v],ext:[ri,pid,seed,0]};},acc);
    petalTips.push({p:cl[NV-2],id:pid,ring:ri});
    if(ri<=1&&rnd()<0.5)for(let q=0;q<1;q++){const v=rr(0.35,0.85),u=rr(-0.6,0.6);const j=Math.round(v*NV);
      const hw=W*0.5*Math.pow(Math.sin(PI*Math.pow(v,1.12)),0.52);
      const pp=V.add(V.add(cl[j],V.mul(tg,u*hw)),V.mul(nin(ang[j]),cup*hw*u*u*0.42*0.8+0.004));petalDropSpots.push(pp);}
    pid++;}});
  finish(acc);
  // receptacle
  const rec=lathe([[0.0,-0.03],[0.026,-0.03],[0.042,0.02],[0.056,0.068],[0.061,0.082],[0.058,0.090],[0.050,0.094],[0.025,0.097],[0.0,0.098]],40);
  // stamens
  const tubeG=(()=>{const a={pos:[],nrm:[],uv:[],ext:[],idx:[]};const NA=8,NR=6;
    for(let i=0;i<=NA;i++){const s=i/NA;const r=s<0.45?0.0022:(s<0.9?0.0048:0.0032*(1-(s-0.9)*6));
      for(let j=0;j<=NR;j++){const t=j/NR*TAU;a.pos.push(Math.cos(t)*r,s,Math.sin(t)*r);a.nrm.push(Math.cos(t),0,Math.sin(t));a.uv.push(s,j/NR);a.ext.push(0,0,0,0);}}
    for(let i=0;i<NA;i++)for(let j=0;j<NR;j++){const q=i*(NR+1)+j;a.idx.push(q,q+NR+1,q+1,q+1,q+NR+1,q+NR+2);}return a;})();
  const sInst=[];for(let i=0;i<170;i++){const phi=rr(0,TAU),r=rr(0.05,0.072),b=rr(0.35,1.05);
    const rh=[Math.cos(phi),0,Math.sin(phi)];sInst.push(rh[0]*r,rr(0.0,0.05),rh[2]*r,rr(0.07,0.10),rh[0]*Math.sin(b),Math.cos(b),rh[2]*Math.sin(b),rnd());}
  const dropInst=[];petalDropSpots.forEach(p=>{const sz=rr(0.005,0.012);dropInst.push(p[0],p[1]+sz*0.55,p[2],sz);});
  return{petals:mesh(acc),rec:mesh(rec),stamens:mesh(tubeG,{data:new Float32Array(sInst),layout:[4,4],count:sInst.length/8}),
    drops:mesh(DROP_GEO,{data:new Float32Array(dropInst),layout:[4],count:dropInst.length/4})};
})();

function initAudio(){

  const sr=ctx.sampleRate;const mk=(sec,fill)=>{const b=ctx.createBuffer(2,sr*sec,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);fill(d,c);}return b;};

function sim(dt,t){

  const wx=0.016*n1(t*0.33+1.7)+0.006*n1(t*1.1),wz=0.020*n1(t*0.29+4.2)+0.007*n1(t*0.9+9);

  // --- petal flutter
  for(let i=0;i<24;i++){jigV[i]+=(-900*jig[i]-14*jigV[i])*dt;jig[i]+=jigV[i]*dt;}
  const hits=rainK.d*3.5*dt;
  if(rnd()<hits){const tp=petalTips[Math.floor(rnd()*petalTips.length)];jigV[tp.id]+=rr(-4.5,4.5)*(tp.ring<2?1:0.6);

    playDrip(clamp((wp[0]-cam.eye[0])*0.6,-1,1),0.10,rr(1.4,1.9));}
  // --- pads bob on the swell
  for(const p of pads){const y=0.012+0.004*Math.sin(t*1.2+p.ph)+0.002*n1(t*0.7+p.ph*3);
    p.model=M.chain(M.T(p.c[0],p.c[1]+y,p.c[2]),M.RX(0.012*n1(t*0.6+p.ph)),M.RZ(0.012*n1(t*0.5+p.ph*2)),M.RY(p.rot),M.S(p.rad));}

  for(const l of leaves){l.ax=0.010*l.amp*n1(t*0.4+l.ph)+0.004*n1(t*1.7+l.ph);l.az=0.012*l.amp*n1(t*0.37+l.ph*2)+0.004*n1(t*1.5+l.ph);

    gl.bindBuffer(gl.ARRAY_BUFFER,partBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,pGPU,0,pcount*6);
    gl.bindVertexArray(partVao);gl.drawArrays(gl.POINTS,0,pcount);}
  gl.depthMask(true);gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);
  if(RT.ms){gl.bindFramebuffer(gl.READ_FRAMEBUFFER,RT.ms);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,RT.resolve);
    gl.blitFramebuffer(0,0,RW,RH,0,0,RW,RH,gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT,gl.NEAREST);}
  // 3) depth of field (half res)
  const postU={uNear:cam.near,uFar:cam.far,uFocus:cam.focus,uAp:DOF.ap};
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.dof);gl.viewport(0,0,RT.rw,RT.rh);
  use(P.dof,{...postU,uColor:RT.col,uDepth:RT.dep,uTexel:[1/RT.rw,1/RT.rh],uMaxBlur:maxBlur*0.5,uRad:DOF.rad});fsTri();
  // 4) bloom
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b1);gl.viewport(0,0,RT.qw,RT.qh);use(P.bright,{uTex:RT.dofC,uTexel:[1/RT.rw,1/RT.rh]});fsTri();
  use(P.blur);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b2);set(P.blur,{uTex:RT.b1C,uDir:[1/RT.qw,0]});fsTri();
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b1);set(P.blur,{uTex:RT.b2C,uDir:[0,1/RT.qh]});fsTri();
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b3);gl.viewport(0,0,RT.ew,RT.eh);set(P.blur,{uTex:RT.b1C,uDir:[1.5/RT.qw,0]});fsTri();
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b4);set(P.blur,{uTex:RT.b3C,uDir:[0,1.5/RT.eh]});fsTri();
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b3);set(P.blur,{uTex:RT.b4C,uDir:[1.5/RT.ew,0]});fsTri();
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b4);set(P.blur,{uTex:RT.b3C,uDir:[0,1.5/RT.eh]});fsTri();
  // 5) final
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  const fade=STILL?1:smooth(0,3.5,(performance.now()-tStart)/1000);
  use(P.final,{...postU,uColor:RT.col,uDepth:RT.dep,uDof:RT.dofC,uBloom:RT.b4C,uTexel:[1/RW,1/RH],uTime:simT,uFade:fade,uExposure:EXPO,uMaxBlurFull:maxBlur});fsTri();
}
DOF.rad=0.75;

function frame(now){
  const dt=Math.min(0.05,(now-tPrev)/1000);tPrev=now;
  resize();
  dripBudget=Math.min(dripBudget+dt*28,6);
  simT+=dt;updateCamera(simT);sim(dt,simT);render();
  // adaptive quality: watch the first few seconds and step resolution down if needed
  if(!qualityChecked&&!STILL){frames++;if(frames>30){ftAcc+=dt;}
    if(frames===150){const avg=ftAcc/120;qualityChecked=true;
      if(avg>0.034){renderScale=0.62;DOF.rad=1.3;}else if(avg>0.024){renderScale=0.8;DOF.rad=1.0;}}}
  if(!STILL||frames<2)requestAnimationFrame(frame);
}
if(STILL){
  // deterministic warm-up for screenshots
  resize();const steps=Math.round(Math.max(T_OFF,0.5)*30);simT=0;
  for(let i=0;i<steps;i++){simT+=1/30;updateCamera(simT);sim(1/30,simT);}
  updateCamera(simT);render();window.__ready=true;
}else{requestAnimationFrame(frame);}

/* ==================================================================
   UI + INTERACTION
   ================================================================== */
const veil=document.getElementById('veil'),title=document.getElementById('title'),ui=document.getElementById('ui'),hint=document.getElementById('hint');
requestAnimationFrame(()=>{veil.style.opacity=0;title.style.opacity=1;});
let uiTimer=0;function showUI(){ui.classList.add('on');clearTimeout(uiTimer);uiTimer=setTimeout(()=>ui.classList.remove('on'),3200);}
setTimeout(()=>{showUI();hint.style.opacity=1;setTimeout(()=>hint.style.opacity=0,5200);},2600);
setTimeout(()=>{title.style.transition='opacity 4s ease';title.style.opacity=0.55;},9000);
window.addEventListener('pointermove',e=>{mouse.tx=(e.clientX/window.innerWidth)*2-1;mouse.ty=(e.clientY/window.innerHeight)*2-1;showUI();},{passive:true});
window.addEventListener('deviceorientation',e=>{if(e.gamma==null)return;mouse.tx=clamp(e.gamma/30,-1,1);mouse.ty=clamp((e.beta-45)/30,-1,1);},{passive:true});
canvas.addEventListener('pointerdown',e=>{
  showUI();
  // ray from the camera through the click onto the water
  const r=canvas.getBoundingClientRect();const nx=((e.clientX-r.left)/r.width)*2-1,ny=1-((e.clientY-r.top)/r.height)*2;
  const asp=W/H;const th=Math.tan(cam.fov/2);
  const v=cam.view;const right=[v[0],v[4],v[8]],up=[v[1],v[5],v[9]],back=[v[2],v[6],v[10]];
  const d=V.norm(V.add(V.add(V.mul(right,nx*th*asp),V.mul(up,ny*th)),V.mul(back,-1)));
  if(d[1]>=-0.01)return;const t=-cam.eye[1]/d[1];const hit=V.madd(cam.eye,d,t);
  user.set([hit[0],hit[2],simT,1.0],userIdx*4);userIdx=(userIdx+1)%8;
  splash(hit[0],0,hit[2],1.9,0);splash(hit[0],0,hit[2],1.4,0);
  // a heavy drop near the flower makes it nod
  const fd=Math.hypot(hit[0]-FLOWER_POS[0],hit[2]-FLOWER_POS[2]);if(fd<1.5){sw.vx+=0.05*(1.5-fd)*Math.sign(hit[2]-FLOWER_POS[2]||1);sw.vz+=-0.05*(1.5-fd)*Math.sign(hit[0]-FLOWER_POS[0]||1);}
  if(!AU.ctx)setSound(true);
  const pr=AU.on;if(pr){dripBudget+=2;playDrip(clamp((hit[0]-cam.eye[0])*0.4,-1,1),0.5,rr(0.45,0.6));}
});
document.getElementById('bSnd').addEventListener('click',e=>{e.stopPropagation();setSound(!AU.on);});
document.getElementById('bRain').addEventListener('click',e=>{e.stopPropagation();rainLevel=(rainLevel+1)%3;const L_=RAIN_LEVELS[rainLevel];
  rainK={d:L_.d,amp:L_.amp,streak:L_.streak,snd:L_.snd};document.querySelector('#bRain b').textContent=L_.n;
  if(AU.on&&AU.ctx){const t=AU.ctx.currentTime;AU.master.gain.setTargetAtTime(0.9*rainK.snd,t,0.6);}});
document.getElementById('bFs').addEventListener('click',e=>{e.stopPropagation();const d=document;if(!d.fullscreenElement){(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||function(){}).call(d.documentElement);}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}});
['pointerdown','pointermove'].forEach(ev=>ui.addEventListener(ev,e=>e.stopPropagation()));
window.addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')setSound(!AU.on);if(e.key==='f'||e.key==='F')document.getElementById('bFs').click();if(e.key==='r'||e.key==='R')document.getElementById('bRain').click();});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('图形上下文已丢失，请刷新页面');});
})();
</script>
